<!-- MODO OSCURO GLOBAL + BOTÓN EN CABECERA (CAYMAN) -->
<style>
/* Botón en la cabecera (esquina superior derecha) */
.theme-toggle-wrap{
  position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:8px;
}
.btn-theme{
  display:inline-block; padding:6px 10px; border-radius:8px; border:1px solid #e5e7eb;
  background:#ffffff; cursor:pointer; font-size:14px;
}
.btn-theme:hover{ background:#f3f4f6 }

/* Oscuro */
html[data-theme="dark"] body { background:#0f1115; color:#e5e7eb; }
html[data-theme="dark"] a { color:#8dd2ff; }
html[data-theme="dark"] .page-header { background:linear-gradient(120deg,#0d1b2a,#0b1320); }
html[data-theme="dark"] .site-footer,
html[data-theme="dark"] .site-footer-owner,
html[data-theme="dark"] .site-footer-credits { color:#a3a3a3; }
html[data-theme="dark"] .main-content h1,
html[data-theme="dark"] .main-content h2,
html[data-theme="dark"] .main-content h3 { color:#e5e7eb; }

/* Si usas las tarjetas del home */
html[data-theme="dark"] .post-sep { border-top-color:#23262d; }
html[data-theme="dark"] .post-thumb { background:#111827; border-color:#23262d; }

/* Preferencia del sistema si no hay guardada */
@media (prefers-color-scheme: dark){
  html:not([data-theme]) body { background:#0f1115; color:#e5e7eb; }
  html:not([data-theme]) a { color:#8dd2ff; }
  html:not([data-theme]) .page-header { background:linear-gradient(120deg,#0d1b2a,#0b1320); }
}

/* =========================
   TIPOGRAFÍA VERDE MILITAR
   ========================= */
:root{
  --brand: #4B5320;   /* Army Green */
  --text:  #2B3A2A;   /* Verde oscuro para texto */
  --link:  #3E5E3E;   /* Verde para enlaces */
  --muted: #6E7B6C;   /* Texto secundario/fechas */
}
body{ color: var(--text); }
a{ color: var(--link); }
a:hover{ color:#587f58; }
.page-header .project-name,
.main-content h1, .main-content h2, .main-content h3{ color: var(--brand); }
.post-title{ color: var(--brand); }
.post-date, .post-excerpt{ color: var(--muted); }
.hero h1{ color: var(--brand); }
.hero p{ color: var(--text); }
.hero .links a{ color: var(--link); }
.site-footer, .site-footer-owner, .site-footer-credits{ color: var(--muted); }

/* =========================================
   MEJORA: FOTOS SIN RECORTE (se adaptan)
   - Foto de portada (.hero .photo)
   - Miniaturas de posts (.post-thumb)
   ========================================= */
.hero .photo{
  width:100%;
  max-width:220px;   /* controla el ancho máximo en desktop */
  height:auto;       /* altura automática para no deformar */
  object-fit:contain;    /* CLAVE: no recorta */
  object-position:center;
  border-radius:12px;    /* puedes quitar si la prefieres cuadrada */
  background:#fff;       /* fondo blanco cuando sobren márgenes */
  padding:0;             /* pon 6-8px si quieres “marco” blanco */
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.post-thumb{
  width:100%;
  height:110px;          /* mantiene alto visual consistente en cards */
  object-fit:contain;    /* CLAVE: no recorta */
  object-position:center;
  background:#fff;
  padding:6px;           /* pequeño marco para que respire */
  border:1px solid #e5e5e5;
  border-radius:8px;
}

/* Ajuste responsive */
@media (max-width:780px){
  .hero .photo{ max-width:160px; }
}

/* Versiones en modo oscuro para fondos/bordes */
html[data-theme="dark"] .hero .photo{ background:#0b0d12; box-shadow:0 6px 22px rgba(0,0,0,.55); }
html[data-theme="dark"] .post-thumb{ background:#0b0d12; border-color:#23262d; }
</style>

<script>
(function(){
  const STORAGE_KEY = 'theme';
  const root = document.documentElement;

  function setLabel(btn, theme){
    if (!btn) return;
    btn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
  }
  function apply(theme, btn){
    root.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    setLabel(btn, theme);
  }

  // Inicial: guardado o sistema
  const saved = localStorage.getItem(STORAGE_KEY);
  const initial = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  apply(initial);

  // Insertar botón en cabecera del tema Cayman
  document.addEventListener('DOMContentLoaded', function(){
    const header = document.querySelector('.page-header');
    if (!header) return;

    const wrap = document.createElement('div');
    wrap.className = 'theme-toggle-wrap';

    const btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.className = 'btn-theme';
    btn.type = 'button';
    btn.textContent = initial === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

    wrap.appendChild(btn);
    header.style.position = 'relative';
    header.appendChild(wrap);

    btn.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') || initial;
      apply(current === 'dark' ? 'light' : 'dark', btn);
    });
  });
})();
</script>
