<!-- HEAD CUSTOM: Verde militar + imágenes sin recorte + (opcional) modo oscuro -->

<style>
/* ---------------- Botón del tema en cabecera (Cayman) ---------------- */
.theme-toggle-wrap{
  position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:8px;
}
.btn-theme{
  display:inline-block; padding:6px 10px; border-radius:8px; border:1px solid #e5e7eb;
  background:#ffffff; cursor:pointer; font-size:14px;
}
.btn-theme:hover{ background:#f3f4f6 }

/* ---------------- Modo oscuro (opcional) ---------------- */
html[data-theme="dark"] body { background:#0f1115; color:#e5e7eb; }
html[data-theme="dark"] a { color:#8dd2ff; }
html[data-theme="dark"] .page-header { background:linear-gradient(120deg,#0d1b2a,#0b1320); }
html[data-theme="dark"] .site-footer,
html[data-theme="dark"] .site-footer-owner,
html[data-theme="dark"] .site-footer-credits { color:#a3a3a3; }
html[data-theme="dark"] .main-content h1,
html[data-theme="dark"] .main-content h2,
html[data-theme="dark"] .main-content h3 { color:#e5e7eb; }
html[data-theme="dark"] .post-sep { border-top-color:#23262d; }

/* ---------------- VERDE MILITAR (tu paleta) ---------------- */
:root{
  --brand: #4B5320;   /* Army Green (títulos) */
  --text:  #2B3A2A;   /* Verde muy oscuro (texto base) */
  --link:  #3E5E3E;   /* Verde enlaces */
  --muted: #6E7B6C;   /* Texto secundario/fechas */
}

/* Texto principal y enlaces */
body{ color: var(--text); }
a{ color: var(--link); }
a:hover{ color:#587f58; }

/* Encabezados y títulos */
.page-header .project-name,
.main-content h1, .main-content h2, .main-content h3{
  color: var(--brand);
}

/* Lista de posts */
.post-title{ color: var(--brand); }
.post-date, .post-excerpt{ color: var(--muted); }

/* Hero (portada/bio) */
.hero h1{ color: var(--brand); }
.hero p{ color: var(--text); }
.hero .links a{ color: var(--link); }

/* Pie de página */
.site-footer, .site-footer-owner, .site-footer-credits{ color: var(--muted); }

/* ---------------- Imágenes SIN recorte (mantengo tu diseño) ---------------- */

/* Foto de portada (bio) */
.hero .photo{
  width:100%;
  max-width:220px;      /* conserva proporción del layout */
  height:auto;          /* no fuerza alto => no deforma */
  object-fit:contain;   /* CLAVE: no recorta */
  object-position:center;
  border-radius:12px;   /* quita si la prefieres cuadrada */
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  background:transparent;
  padding:0;
}

/* Miniatura en la lista de posts: mantiene 110x110 para no mover el texto */
.post-list .post-item{ grid-template-columns:110px 1fr; }
.post-thumb{
  width:110px; height:110px;
  object-fit:contain;   /* no recorta */
  object-position:center;
  background:transparent;
  padding:0; border:0;  /* sin marcos para que no “engorde” la miniatura */
  border-radius:8px;    /* opcional */
}

/* Responsive */
@media (max-width:780px){
  .hero .photo{ max-width:160px; }
}

/* Ajustes de fondos en oscuro para que no se vean “cortes” */
html[data-theme="dark"] .hero .photo{ background:transparent; box-shadow:0 6px 22px rgba(0,0,0,.55); }
html[data-theme="dark"] .post-thumb{ background:transparent; }
</style>

<script>
/* Toggle de tema (opcional). Si no lo quieres, borra este script y la sección de modo oscuro arriba. */
(function(){
  const STORAGE_KEY = 'theme';
  const root = document.documentElement;

  function setLabel(btn, theme){
    if (!btn) return;
    btn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
  }
  function apply(theme, btn){
    root.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    setLabel(btn, theme);
  }

  const saved = localStorage.getItem(STORAGE_KEY);
  const initial = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  apply(initial);

  document.addEventListener('DOMContentLoaded', function(){
    const header = document.querySelector('.page-header');
    if (!header) return;

    const wrap = document.createElement('div');
    wrap.className = 'theme-toggle-wrap';

    const btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.className = 'btn-theme';
    btn.type = 'button';
    btn.textContent = initial === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

    wrap.appendChild(btn);
    header.style.position = 'relative';
    header.appendChild(wrap);

    btn.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') || initial;
      apply(current === 'dark' ? 'light' : 'dark', btn);
    });
  });
})();
</script>
