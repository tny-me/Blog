<!-- HEAD CUSTOM: mantiene diseño original, sin cambiar tipografía.
     Solo ajusta imágenes (portada y miniaturas) para que NO se recorten.
     Deja el modo oscuro opcional con botón en cabecera (si ya lo usas). -->

<style>
/* --- Botón de tema en la cabecera (Cayman) --- */
.theme-toggle-wrap{
  position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:8px;
}
.btn-theme{
  display:inline-block; padding:6px 10px; border-radius:8px; border:1px solid #e5e7eb;
  background:#ffffff; cursor:pointer; font-size:14px;
}
.btn-theme:hover{ background:#f3f4f6 }

/* --- Modo oscuro (si no lo usas, puedes borrar esta sección y el script) --- */
html[data-theme="dark"] body { background:#0f1115; color:#e5e7eb; }
html[data-theme="dark"] a { color:#8dd2ff; }
html[data-theme="dark"] .page-header { background:linear-gradient(120deg,#0d1b2a,#0b1320); }
html[data-theme="dark"] .site-footer,
html[data-theme="dark"] .site-footer-owner,
html[data-theme="dark"] .site-footer-credits { color:#a3a3a3; }
html[data-theme="dark"] .main-content h1,
html[data-theme="dark"] .main-content h2,
html[data-theme="dark"] .main-content h3 { color:#e5e7eb; }
html[data-theme="dark"] .post-sep { border-top-color:#23262d; }

/* --- Ajuste de imágenes sin alterar el layout/estética --- */

/* Foto de portada (bio): se adapta sin recortarse */
.hero .photo{
  width:100%;
  max-width:220px;           /* mantiene proporción del diseño */
  height:auto;               /* NO fija alto => no deforma */
  object-fit:contain;        /* CLAVE: no recorta */
  object-position:center;
  border-radius:12px;        /* déjalo si te gusta suave; quítalo si la prefieres cuadrada */
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  background:transparent;
  padding:0;                 /* sin padding para no mover el layout */
}

/* Miniatura de la lista de posts:
   mantiene el bloque de 110x110 para que el texto siga alineado igual */
.post-list .post-item{ grid-template-columns:110px 1fr; }
.post-thumb{
  width:110px; height:110px;
  object-fit:contain;        /* no recorta, encaja dentro */
  object-position:center;
  background:transparent;    /* respeta el fondo del tema */
  padding:0; border:0;       /* sin marcos para no “ensanchar” la miniatura */
  border-radius:8px;         /* opcional, queda bien con imágenes cuadradas */
}

/* Pequeño ajuste responsive (opcional) */
@media (max-width:780px){
  .hero .photo{ max-width:160px; }
}
</style>

<script>
/* Toggle de tema (opcional). Si no lo quieres, borra este script y los estilos del modo oscuro. */
(function(){
  const STORAGE_KEY = 'theme';
  const root = document.documentElement;

  function setLabel(btn, theme){
    if (!btn) return;
    btn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
  }
  function apply(theme, btn){
    root.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    setLabel(btn, theme);
  }

  const saved = localStorage.getItem(STORAGE_KEY);
  const initial = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  apply(initial);

  document.addEventListener('DOMContentLoaded', function(){
    const header = document.querySelector('.page-header');
    if (!header) return;

    const wrap = document.createElement('div');
    wrap.className = 'theme-toggle-wrap';

    const btn = document.createElement('button');
    btn.id = 'theme-toggle';
    btn.className = 'btn-theme';
    btn.type = 'button';
    btn.textContent = initial === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

    wrap.appendChild(btn);
    header.style.position = 'relative';
    header.appendChild(wrap);

    btn.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') || initial;
      apply(current === 'dark' ? 'light' : 'dark', btn);
    });
  });
})();
</script>
